# Minimal one-line Starship / Catppuccin Mocha

add_newline = false
format = '$character$directory$git_branch${custom.git_dirty} '

[character]
format = '$symbol '
success_symbol = "[\u279C](bold #a6e3a1)"
error_symbol = "[\u279C](bold #f38ba8)"

[directory]
format = '[$path]($style) '
style = 'bold #89dceb'
truncation_length = 1
truncate_to_repo = false

[git_branch]
symbol = "\uE0A0 "
format = '[$symbol$branch]($style) '
style = 'bold #cba6f7'

[custom.git_dirty]
when = 'test -n "$(git status --porcelain 2>/dev/null)"'
format = '[●](bold #f9e2af) '
require_repo = true
